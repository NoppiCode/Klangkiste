<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klangkiste">
<meta name="description" content="Klangkiste – bunte Klang-Knöpfe mischen und eigene Lieder bauen.">
<title>Klangkiste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#14122B; --surf:#221F45; --surf2:#1C1A3A; --line:#2E2A5A; --line2:#5A5590;
  --txt:#F5F3FF; --mut:#B8B3E0;
  --red:#FF6B57; --blue:#4D9FFF; --yel:#FFC93C; --mint:#3EE0A8; --pink:#FF7AC6; --lila:#B39DFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:ui-rounded,"Nunito","SF Pro Rounded","Varela Round","Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;font-size:inherit}
button:focus-visible,[role=slider]:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
svg{flex-shrink:0}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;display:flex;flex-direction:column;gap:18px}
#screen>*{flex-shrink:0}
#dock:empty{display:none}
#dock{background:var(--surf2);border-top:1px solid var(--line);padding:12px 18px}
#nav{display:flex;justify-content:space-around;background:var(--surf2);border-top:1px solid var(--line);padding:6px 2px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{position:relative;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;min-width:60px;min-height:52px;cursor:pointer;padding:4px;border-radius:14px}
.nav-btn.on{color:var(--yel);font-weight:800}
.nav-btn .badge{position:absolute;top:4px;right:12px;width:10px;height:10px;border-radius:5px;background:var(--red);border:2px solid var(--surf2)}

.row{display:flex;align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column}
.b{font-weight:800}
.sm{font-size:13px}.xs{font-size:12px}
.mut{color:var(--mut)}
.h1{font-weight:800;font-size:24px;line-height:1.15}
.h2{font-weight:800;font-size:20px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--surf);border-radius:24px;padding:18px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px}
.logo-ic{width:44px;height:44px;border-radius:14px;background:var(--yel);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.stars{display:flex;align-items:center;gap:6px;background:var(--surf);border-radius:22px;padding:0 14px 0 10px;height:44px;font-weight:800;font-size:17px;color:var(--yel);border:0;cursor:pointer}
.stars.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25)}}

.btn{border:0;cursor:pointer;border-radius:18px;min-height:52px;padding:0 20px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.yel{background:var(--yel);color:var(--bg)}
.btn.mint{background:var(--mint);color:var(--bg)}
.btn.dark{background:var(--bg);color:var(--txt)}
.btn.ghost{background:var(--surf);color:var(--txt)}
.btn.outline{background:transparent;color:var(--txt);border:2.5px solid var(--c,var(--mint))}
.btn.small{min-height:44px;padding:0 14px;font-size:14px;border-radius:14px}
.btn[disabled]{opacity:.55;cursor:default}
.ic-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surf);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ic-btn.light{background:var(--txt);color:var(--bg)}

/* Start */
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hero-deco{position:absolute;right:-18px;top:-18px;display:grid;grid-template-columns:repeat(3,34px);gap:8px;transform:rotate(12deg)}
.hero-deco i{width:34px;height:34px;border-radius:10px;display:block}
.hero-t{font-weight:800;font-size:29px;line-height:1.1;max-width:220px}
.hero-s{font-size:15px;color:#C9C5EC;line-height:1.4;max-width:250px}
.level{display:flex;align-items:center;gap:14px}
.lvl-badge{width:56px;height:56px;border-radius:18px;background:var(--lila);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1}
.lvl-badge small{font-size:10px;letter-spacing:.5px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--yel);border-radius:5px;transition:width .5s}
.gift{display:flex;align-items:center;gap:14px;background:var(--pink);color:var(--bg);border:0;border-radius:24px;padding:14px 16px;cursor:pointer;text-align:left;animation:wiggle 2.4s infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-1.5deg)}90%{transform:rotate(1.5deg)}95%{transform:rotate(-1deg)}}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.world{border:0;cursor:pointer;text-align:left;color:var(--bg);border-radius:22px;padding:14px 16px;height:104px;display:flex;flex-direction:column;justify-content:space-between;position:relative;outline-offset:3px}
.world.sel{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--txt)}
.world.locked{background:var(--bg)!important;color:var(--mut);border:2px dashed var(--line2)}
.world .tag{position:absolute;top:12px;right:12px;background:var(--bg);color:var(--txt);border-radius:10px;padding:3px 8px;font-size:11px;font-weight:800}
.world-n{font-weight:800;font-size:16px}
.song{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:18px;padding:10px 10px 10px 12px}
.song-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;text-align:left;padding:0;min-height:44px}
.song-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:10px;flex-shrink:0}
.song-ic i{width:4px;background:var(--bg);border-radius:2px;display:block}
.song-ic i:nth-child(1){height:12px}.song-ic i:nth-child(2){height:22px}.song-ic i:nth-child(3){height:16px}.song-ic i:nth-child(4){height:8px}
.song.playing .song-ic i{animation:eq .5s infinite alternate}
.song.playing .song-ic i:nth-child(2){animation-delay:-.2s}.song.playing .song-ic i:nth-child(3){animation-delay:-.35s}.song.playing .song-ic i:nth-child(4){animation-delay:-.1s}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.song-ic i{transform-origin:bottom}
.empty{border:2px dashed var(--line2);border-radius:20px;padding:18px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}

/* Studio */
.tempo{background:var(--surf);border:0;border-radius:14px;padding:6px 12px;text-align:center;cursor:pointer;min-height:44px;min-width:64px}
.tempo .v{font-weight:800;font-size:18px;line-height:1.1}
.tempo .n{font-size:11px;color:var(--mut);font-weight:700}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:8px;border-radius:4px;background:#3A3670;display:block;transition:background .08s}
.segs i.lit{background:var(--yel)}
.grp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grp-h .dotc{width:10px;height:10px;border-radius:5px}
.grp-h .b{font-size:14px;letter-spacing:.3px}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pad{height:74px;border-radius:20px;border:2.5px solid var(--c);background:var(--surf);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:14px;cursor:pointer;padding:0 2px;transition:background .15s,box-shadow .2s,transform .12s;touch-action:manipulation}
.pad .dot{width:16px;height:16px;border-radius:8px;border:2.5px solid var(--c)}
.pad .eq{display:none;align-items:flex-end;gap:3px;height:16px}
.pad .eq i{width:4px;border-radius:2px;background:var(--bg);display:block;transform-origin:bottom}
.pad .eq i:nth-child(1){height:10px}.pad .eq i:nth-child(2){height:16px}.pad .eq i:nth-child(3){height:7px}
.pad.on{background:var(--c);color:var(--bg);box-shadow:0 0 0 5px var(--g);transform:scale(1.03)}
.pad.on .dot{display:none}.pad.on .eq{display:flex}
.pad.hit{animation:hit .2s ease-out}
.pad.on.hit .eq i{animation:eq .2s alternate 2}
@keyframes hit{0%{transform:scale(1.08)}100%{transform:scale(1.03)}}
.pad.locked{border:2px dashed var(--line2);color:var(--mut);gap:2px;font-size:13px}
.cost{display:inline-flex;align-items:center;gap:3px;color:var(--yel);font-weight:800;font-size:12px}
.dock-row{display:flex;align-items:center;gap:12px}
.bigplay{width:64px;height:64px;border-radius:32px;border:0;background:var(--yel);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bigplay.on{background:var(--txt)}

/* Raster */
.cells,.bnums{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bnums div{text-align:center;font-size:12px;font-weight:800;color:var(--mut)}
.bnums div.head{color:var(--yel)}
.track-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.track-h .sq{width:22px;height:22px;border-radius:7px}
.cell{height:46px;border-radius:12px;border:2.5px solid var(--line);background:var(--surf);cursor:pointer;padding:0;transition:background .1s}
.cell.alt{background:var(--surf2)}
.cell.on{background:var(--c);border-color:var(--c)}
.cell.head{border-color:var(--txt)}
.cell.on.head{box-shadow:0 0 0 4px var(--g)}

/* Mixer */
.faders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.fval{font-weight:800;font-size:16px}
.fader{width:56px;height:200px;display:flex;justify-content:center;cursor:pointer;touch-action:none;border-radius:12px}
.rail{position:relative;width:14px;height:100%;border-radius:7px;background:var(--line)}
.rail .fill{position:absolute;left:0;bottom:0;width:100%;border-radius:7px;background:var(--c)}
.rail .thumb{position:absolute;left:-15px;width:44px;height:28px;border-radius:10px;background:var(--txt);box-shadow:0 4px 0 #0B0A1C}
.fcol.muted .fill{background:#3A3670}.fcol.muted .thumb{background:#8B86BF}.fcol.muted .fval,.fcol.muted .fname{color:var(--mut)}
.mute{width:44px;height:44px;border-radius:14px;border:0;background:var(--c);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mute.off{background:var(--bg);border:2.5px solid var(--c);color:var(--c)}
.fname{font-weight:800;font-size:12px}
.fxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.knob{border:0;cursor:pointer;background:var(--surf);color:var(--txt);border-radius:20px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.knob.locked{background:var(--bg);border:2px dashed var(--line2);color:var(--mut)}
.knob .kl{font-size:12px;color:var(--mut);font-weight:700}

/* Schatzkiste */
.earn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.earn div{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.35}
.earn b{color:var(--yel)}
.item{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:18px;padding:10px 10px 10px 12px}
.item-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--bg);flex-shrink:0}
.item.own .item-ic{opacity:.95}
.owned{display:flex;align-items:center;gap:4px;color:var(--mint);font-weight:800;font-size:13px;padding-right:8px}
.ach{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surf)}
.ach.done{background:#26324A}
.ach-ic{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--mut);flex-shrink:0}
.ach.done .ach-ic{background:var(--yel);color:var(--bg)}

/* Modal, Toast */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,7,20,.7)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-radius:28px 28px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.sheet .btn{width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:14px}
.field input{height:52px;border-radius:16px;border:2.5px solid var(--line2);background:var(--bg);color:var(--txt);padding:0 16px;font-size:17px;font-family:inherit;font-weight:700;-webkit-user-select:text;user-select:text}
.big-ic{width:72px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center;align-self:center;color:var(--bg)}
.center{text-align:center}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--txt);color:var(--bg);border-radius:18px;padding:10px 16px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .3s ease-out, tout .3s ease-in 2.4s forwards;max-width:92vw}
.toast .st{color:#C98A00}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.conf{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="screen" aria-live="polite"></main>
  <div id="dock"></div>
  <nav id="nav" aria-label="Hauptmenü"></nav>
</div>
<div id="modal"></div>
<div id="toasts" role="status"></div>
<div id="confetti"></div>
<noscript><p style="padding:20px">Für die Klangkiste muss JavaScript eingeschaltet sein.</p></noscript>
<script>
'use strict';
/* =========================================================
   Klangkiste – Musik-Mix-Spiel (HTML/PWA, ohne externe Dateien)
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

/* ---------- Icons ---------- */
const sv = (p, s=24, w=2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  play: s => `<svg width="${s||24}" height="${s||24}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>`,
  pause: s => `<svg width="${s||24}" height="${s||24}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`,
  stop: s => `<svg width="${s||24}" height="${s||24}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`,
  star: s => `<svg width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`,
  note: s => sv('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>', s, 2.4),
  home: s => sv('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', s),
  grid: s => sv('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>', s),
  raster: s => sv('<path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 3v18M16 3v18"/>', s),
  mixer: s => sv('<path d="M6 3v18M12 3v18M18 3v18"/><rect x="3.5" y="13" width="5" height="3" rx="1"/><rect x="9.5" y="7" width="5" height="3" rx="1"/><rect x="15.5" y="15" width="5" height="3" rx="1"/>', s),
  chest: s => sv('<path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 10V8a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2"/><rect x="10" y="9" width="4" height="5" rx="1"/>', s),
  lock: s => sv('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', s),
  save: s => sv('<path d="M5 3h11l3 3v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="5" rx="1"/>', s),
  gift: s => sv('<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7"/><path d="M12 8v12"/><path d="M12 8c-2-4-6-4-6-1.5S10 8 12 8zM12 8c2-4 6-4 6-1.5S14 8 12 8z"/>', s),
  pencil: s => sv('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', s),
  trash: s => sv('<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>', s),
  dice: s => sv('<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="16" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="16" r="1.2" fill="currentColor"/>', s),
  eraser: s => sv('<path d="M8 20h12"/><path d="M4.5 14.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18H7z"/>', s),
  check: s => sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', s, 2.8),
  vol: s => sv('<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>', s, 2.4),
  mute: s => sv('<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>', s, 2.4),
  ear: s => sv('<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2.5" y="14" width="5" height="7" rx="2"/><rect x="16.5" y="14" width="5" height="7" rx="2"/>', s),

/* ---------- Klang-Engine (Web Audio, alles synthetisch) ---------- */
let AC = null, N = null, NOISE = null;
function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) { toast('Dein Browser kann leider keine Töne abspielen.'); return null; }
    AC = new C({latencyHint:'interactive'});
    buildGraph();
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function impulse(sec) {
  const r = AC.sampleRate, len = Math.floor(r * sec), b = AC.createBuffer(2, len, r);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return b;
}
function buildGraph() {
  const c = AC, n = {};
  n.bus = c.createGain();
  n.trem = c.createGain();
  n.tremLfo = c.createOscillator(); n.tremLfo.frequency.value = 4;
  n.tremDepth = c.createGain(); n.tremDepth.gain.value = 0;
  n.tremLfo.connect(n.tremDepth); n.tremDepth.connect(n.trem.gain); n.tremLfo.start();
  n.filt = c.createBiquadFilter(); n.filt.type = 'lowpass'; n.filt.frequency.value = 20000; n.filt.Q.value = 0.7;
  n.filtLfo = c.createOscillator(); n.filtLfo.frequency.value = 0.5;
  n.filtDepth = c.createGain(); n.filtDepth.gain.value = 0;
  n.filtLfo.connect(n.filtDepth); n.filtDepth.connect(n.filt.frequency); n.filtLfo.start();
  n.comp = c.createDynamicsCompressor();
  n.comp.threshold.value = -16; n.comp.ratio.value = 4; n.comp.attack.value = 0.003; n.comp.release.value = 0.2;
  n.master = c.createGain(); n.master.gain.value = 0.85;
  n.bus.connect(n.trem); n.trem.connect(n.filt); n.filt.connect(n.comp); n.comp.connect(n.master); n.master.connect(c.destination);
  // Hall
  n.rev = c.createConvolver(); n.rev.buffer = impulse(2.6);
  n.revSend = c.createGain(); n.revSend.gain.value = 0;
  n.revSend.connect(n.rev); n.rev.connect(n.bus);
  // Echo
  n.dly = c.createDelay(2); n.dly.delayTime.value = 0.4;
  n.fb = c.createGain(); n.fb.gain.value = 0.3;
  n.dlyLp = c.createBiquadFilter(); n.dlyLp.type = 'lowpass'; n.dlyLp.frequency.value = 2600;
  n.dlySend = c.createGain(); n.dlySend.gain.value = 0;
  n.dlySend.connect(n.dly); n.dly.connect(n.dlyLp); n.dlyLp.connect(n.fb); n.fb.connect(n.dly); n.dlyLp.connect(n.bus);
  // Roboter (Ringmodulation)
  n.ring = c.createOscillator(); n.ring.type = 'square'; n.ring.frequency.value = 70; n.ring.start();
  n.groups = {};
  GROUPS.forEach(g => {
    const x = {};
    x.in = c.createGain(); x.dry = c.createGain(); x.rm = c.createGain(); x.rm.gain.value = 0;
    x.wet = c.createGain(); x.wet.gain.value = 0; x.vol = c.createGain();
    x.in.connect(x.dry); x.dry.connect(x.vol);
    x.in.connect(x.rm); n.ring.connect(x.rm.gain); x.rm.connect(x.wet); x.wet.connect(x.vol);
    x.vol.connect(n.bus); x.vol.connect(n.revSend); x.vol.connect(n.dlySend);
    n.groups[g.id] = x;
  });
  N = n;
  const len = c.sampleRate;
  NOISE = c.createBuffer(1, len, c.sampleRate);
  const d = NOISE.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function setP(param, v) { param.setTargetAtTime(v, AC.currentTime, 0.04); }
function applyMix(m) {
  if (!AC || !N) return;
  GROUPS.forEach(g => {
    const v = (m.vol[g.id] == null ? 70 : m.vol[g.id]) / 100;
    setP(N.groups[g.id].vol.gain, m.mute[g.id] ? 0 : v * v * 1.15);
  });
  const lv = id => (isFree(FXI[id]) ? (m.fx[id] || 0) : 0);
  const beat = 60 / m.tempo;
  setP(N.revSend.gain, lv('hall') * 0.16);
  setP(N.dlySend.gain, lv('echo') * 0.13);
  setP(N.fb.gain, 0.22 + lv('echo') * 0.09);
  N.dly.delayTime.setTargetAtTime(beat * 0.75, AC.currentTime, 0.05);
  const r = lv('robot') / 4;
  ['melody','voice'].forEach(gid => { setP(N.groups[gid].wet.gain, r * 1.1); setP(N.groups[gid].dry.gain, 1 - r * 0.8); });
  N.ring.frequency.setTargetAtTime(55 + lv('robot') * 15, AC.currentTime, 0.05);
  const wb = lv('wobble');
  N.tremLfo.frequency.setTargetAtTime(2 / beat, AC.currentTime, 0.05);
  setP(N.tremDepth.gain, wb * 0.12);
  setP(N.trem.gain, 1 - wb * 0.1);
  const bb = lv('bubble');
  if (bb) {
    const base = 2600 - bb * 450;
    setP(N.filt.frequency, base); setP(N.filtDepth.gain, base * 0.6); setP(N.filt.Q, 7);
    N.filtLfo.frequency.setTargetAtTime(1 / beat / 2, AC.currentTime, 0.05);
  } else {
    setP(N.filt.frequency, 20000); setP(N.filtDepth.gain, 0); setP(N.filt.Q, 0.7);
  }
}

// Bausteine
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function noteOf(w, d) {
  const iv = w.scale === 'maj' ? [0,2,4,7,9] : [0,3,5,7,10];
  return w.root + 12 * Math.floor((d - 1) / 5) + iv[(d - 1) % 5];
}
function O(type, f, t, stop) { const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(stop); return o; }
function Nz(t, stop) { const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true; s.start(t, Math.random() * 0.5); s.stop(stop); return s; }
function Gn() { return AC.createGain(); }
function F(type, f, q) { const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; }
function env(g, t, a, peak, dec) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function chain() { const a = arguments; for (let i = 0; i < a.length - 1; i++) a[i].connect(a[i + 1]); return a[a.length - 1]; }

const SOUNDS = {
  kick(t, f, out, v) { const o = O('sine', 150, t, t + 0.5); o.frequency.exponentialRampToValueAtTime(42, t + 0.13); const g = Gn(); env(g, t, 0.003, 1.1 * v, 0.4); chain(o, g, out); },
  snare(t, f, out, v) {
    const n = Nz(t, t + 0.25), g = Gn(); env(g, t, 0.002, 0.55 * v, 0.18); chain(n, F('highpass', 1500), g, out);
    const o = O('triangle', 190, t, t + 0.15); o.frequency.exponentialRampToValueAtTime(120, t + 0.1); const g2 = Gn(); env(g2, t, 0.002, 0.45 * v, 0.1); chain(o, g2, out);
  },
  hat(t, f, out, v) { const n = Nz(t, t + 0.1), g = Gn(); env(g, t, 0.002, 0.28 * v, 0.05); chain(n, F('highpass', 7500), g, out); },
  clap(t, f, out, v) {
    const n = Nz(t, t + 0.3), g = Gn(); g.gain.setValueAtTime(0.0001, t);
    for (let k = 0; k < 3; k++) { const s = t + k * 0.012; g.gain.setValueAtTime(0.7 * v, s); g.gain.exponentialRampToValueAtTime(0.06, s + 0.01); }
    g.gain.setValueAtTime(0.7 * v, t + 0.036); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    chain(n, F('bandpass', 1400, 1.2), g, out);
  },
  bongo(t, f, out, v) { const o = O('sine', f, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(f * 0.75, t + 0.12); const g = Gn(); env(g, t, 0.002, 0.75 * v, 0.2); chain(o, g, out); },
  crash(t, f, out, v) { const n = Nz(t, t + 1.6), g = Gn(); env(g, t, 0.002, 0.32 * v, 1.4); chain(n, F('highpass', 5000), g, out); },
  brumm(t, f, out, v) { const o = O('sawtooth', f, t, t + 0.5), lp = F('lowpass', 1400); lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(260, t + 0.25); const g = Gn(); env(g, t, 0.005, 0.6 * v, 0.35); chain(o, lp, g, out); },
  wobbel(t, f, out, v) { const o = O('square', f, t, t + 0.5), lp = F('lowpass', 300, 8); lp.frequency.setValueAtTime(300, t); lp.frequency.linearRampToValueAtTime(2000, t + 0.1); lp.frequency.linearRampToValueAtTime(300, t + 0.3); const g = Gn(); env(g, t, 0.005, 0.45 * v, 0.35); chain(o, lp, g, out); },
  tief(t, f, out, v) { const o = O('sine', f, t, t + 0.9), g = Gn(); env(g, t, 0.01, 0.95 * v, 0.7); chain(o, g, out); const o2 = O('triangle', f * 2, t, t + 0.3), g2 = Gn(); env(g2, t, 0.005, 0.15 * v, 0.2); chain(o2, g2, out); },
  groove(t, f, out, v) { const o = O('triangle', f, t, t + 0.4), o2 = O('square', f, t, t + 0.4), m = Gn(); m.gain.value = 0.3; const lp = F('lowpass', 900), g = Gn(); env(g, t, 0.003, 0.7 * v, 0.24); o.connect(lp); chain(o2, m, lp); chain(lp, g, out); },
  tuba(t, f, out, v) { const o = O('sawtooth', f, t, t + 0.7), lp = F('lowpass', 450, 2), g = Gn(); env(g, t, 0.045, 0.6 * v, 0.45); chain(o, lp, g, out); },
  hopp(t, f, out, v) { const o = O('square', f * 2, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(f, t + 0.06); const g = Gn(); env(g, t, 0.003, 0.45 * v, 0.18); chain(o, F('lowpass', 1300), g, out); },
  piano(t, f, out, v) { const o = O('triangle', f, t, t + 1.2), o2 = O('sine', f * 2, t, t + 0.6), m = Gn(); m.gain.value = 0.3; const g = Gn(); env(g, t, 0.004, 0.5 * v, 0.9); o.connect(g); chain(o2, m, g); g.connect(out); },
  bell(t, f, out, v) {
    const c = O('sine', f, t, t + 1.9), mo = O('sine', f * 3.5, t, t + 1.9), mg = Gn();
    mg.gain.setValueAtTime(f * 2, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.2);
    chain(mo, mg, c.frequency); const g = Gn(); env(g, t, 0.002, 0.32 * v, 1.6); chain(c, g, out);
  },
  flute(t, f, out, v, len) {

/* ---------- Ablauf (Sequenzer) ---------- */
const SEQ = {playing:false, mix:null, source:null, songId:null, step:0, next:0, timer:null, queue:[], vis:-1};
function startSeq(mix, source, songId) {
  const c = audio(); if (!c) return;
  SEQ.mix = mix; SEQ.source = source; SEQ.songId = songId || null;
  applyMix(mix);
  SEQ.step = 0; SEQ.next = c.currentTime + 0.06; SEQ.queue = []; SEQ.vis = -1; SEQ.playing = true;
  clearInterval(SEQ.timer); SEQ.timer = setInterval(tick, 25); tick();
  requestAnimationFrame(draw);
}
function stopSeq() {
  SEQ.playing = false; clearInterval(SEQ.timer); SEQ.queue = []; SEQ.vis = -1; SEQ.songId = null; SEQ.source = null;
  showStep(-1);
}
function tick() {
  if (!SEQ.playing) return;
  const m = SEQ.mix, len = 60 / m.tempo / 2;
  while (SEQ.next < AC.currentTime + 0.12) {
    playStep(m, SEQ.step, SEQ.next, len);
    SEQ.queue.push({s:SEQ.step, t:SEQ.next});
    SEQ.next += len;
    SEQ.step = (SEQ.step + 1) % 8;
    if (SEQ.step === 0) onLoop();
  }
}
function playStep(m, s, t, len) {
  const w = WORLD[m.world] || WORLDS[0];
  m.active.forEach(id => {
    const p = PAD[id]; if (!p || !isFree(p)) return;
    const d = patOf(m, id)[s]; if (!d) return;
    const f = mtof(noteOf(w, d) + (p.oct || 0));
    const v = id === 'hat' && s % 2 ? 0.55 : 1;
    try { SOUNDS[id](t, f, N.groups[p.g].in, v, len); } catch (e) {}
  });
}
function draw() {
  if (!SEQ.playing) return;
  let s = null;
  while (SEQ.queue.length && SEQ.queue[0].t <= AC.currentTime) s = SEQ.queue.shift().s;
  if (s !== null && s !== SEQ.vis) { SEQ.vis = s; showStep(s); }
  requestAnimationFrame(draw);
}
function showStep(s) {
  const edit = SEQ.playing && SEQ.source === 'edit';
  $$('.segs i').forEach((el, i) => el.classList.toggle('lit', edit && i <= s));
  $$('.cell').forEach(el => el.classList.toggle('head', edit && +el.dataset.i === s));
  $$('.bnums div').forEach((el, i) => el.classList.toggle('head', edit && i === s));
  if (edit && s >= 0) {
    S.edit.active.forEach(id => {
      if (!patOf(S.edit, id)[s]) return;
      const el = document.querySelector('.pad[data-id="' + id + '"]');
      if (el) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
    });
  }
}
function onLoop() {
  S.stats.loops++;
  if (SEQ.source === 'edit' && S.edit.active.length) {
    if (!S.stats.worlds.includes(S.edit.world)) S.stats.worlds.push(S.edit.world);
    if (S.edit.active.length >= 3) {
      S.loopCount++;
      if (S.loopCount >= 8) {
        S.loopCount = 0;
        if (S.activity) { S.activity = false; addStars(1, 'Fleißig gemischt!'); }
      }
    }
  }
  checkAch(); persist();
}
function playEdit() { startSeq(S.edit, 'edit'); render(); }
function toggleEditPlay() {
  if (SEQ.playing && SEQ.source === 'edit') stopSeq();
  else {
    if (!S.edit.active.length) { toast('Tippe zuerst ein paar bunte Knöpfe an!'); UI.tab = 'studio'; render(true); return; }
    startSeq(S.edit, 'edit');
  }
  render();
}
function preview(id) {
  const c = audio(); if (!c) return;
  const p = PAD[id], w = WORLD[S.edit.world] || WORLDS[0], len = 60 / 110 / 2;
  [0,1,2,3].forEach(k => {
    if (!p.pitched && k % 2) return;
    const d = p.pitched ? [1,3,5,8][k] : 1;
    SOUNDS[id](c.currentTime + 0.05 + k * len * 1.2, mtof(noteOf(w, d) + (p.oct || 0)), N.bus, 1, len);
  });

/* ---------- Sterne, Erfolge, Level ---------- */

    const pat = [];

    if (id === 'kick') pat[0] = 1;

      <button class="song-main" data-act="songmenu" data-id="${s.id}" aria-label="${esc(s.name)} – Optionen">
        <span class="song-ic" style="background:${w.color}"><i></i><i></i><i></i><i></i></span>
        <span class="grow"><span class="b ellip" style="display:block">${esc(s.name)}</span><span class="mut sm">${w.name} · ${s.active.length} Klänge</span></span>
      </button>
      <button class="ic-btn light" data-act="listen" data-id="${s.id}" aria-label="${pl ? 'Stopp' : esc(s.name) + ' anhören'}">${pl ? ICON.stop(18) : ICON.play(18)}</button>
    </div>`;
  }).join('');
  const worlds = WORLDS.map(w => {
    const free = isFree(w), sel = S.edit.world === w.id;
    return `<button class="world${free ? '' : ' locked'}${sel && free ? ' sel' : ''}" data-act="world" data-id="${w.id}" style="background:${w.color}" aria-pressed="${sel}">
      ${free ? ICON.world[w.id](30) : ICON.lock(28)}
      ${free ? (sel ? '<span class="tag">Gewählt</span>' : '') : `<span class="tag cost" style="color:var(--yel)">${ICON.star(12)} ${w.cost}</span>`}
      <span class="world-n">${w.name}</span></button>`;
  }).join('');
  return `
  <header class="top"><div class="logo"><span class="logo-ic">${ICON.note(26)}</span>Klangkiste</div>${starPill()}</header>
  <div class="card level"><div class="lvl-badge"><small>LEVEL</small>${li + 1}</div>
    <div class="grow"><div class="b">${lv.n}</div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="mut xs">${nx ? 'Noch ' + (nx.at - S.total) + ' Sterne bis „' + nx.n + '“' : 'Höchstes Level erreicht!'}</div></div></div>
  ${giftOpen ? `<button class="gift" data-act="gift">${ICON.gift(34)}<span class="grow"><span class="b" style="display:block;font-size:17px">Tagesgeschenk!</span><span class="sm" style="font-weight:700">Tippe hier für 5 Sterne</span></span></button>` : ''}
  <div class="card hero">
    <div class="hero-deco" aria-hidden="true"><i style="background:#FF6B57"></i><i style="background:#4D9FFF"></i><i style="background:#FFC93C"></i><i style="background:#3EE0A8"></i><i style="background:#FF7AC6"></i><i style="background:#FF6B57"></i></div>
    <div class="hero-t">Lass uns Musik bauen!</div>
    <div class="hero-s">Tippe bunte Klang-Knöpfe an und mische sie zu deinem eigenen Lied.</div>
    <div class="row gap10" style="flex-wrap:wrap">
      <button class="btn yel" data-act="newmix">${ICON.plus(20)} Neuer Mix</button>
      ${S.edit.active.length ? `<button class="btn ghost" data-act="tab" data-tab="studio" style="background:var(--bg)">Weiter mixen</button>` : ''}
    </div>
  </div>
  ${installPrompt ? `<button class="btn mint" data-act="install">${ICON.install(20)} Als App installieren</button>` : ''}
  <section class="col gap12"><div class="row" style="justify-content:space-between;align-items:baseline"><div class="h2">Klangwelt wählen</div>
    <div class="mut sm">${WORLDS.filter(isFree).length} von ${WORLDS.length} frei</div></div>
    <div class="worlds">${worlds}</div></section>
  <section class="col gap10"><div class="h2">Meine Lieder</div>
    ${songs || '<div class="empty">Noch keine Lieder gespeichert.<br>Bau einen Mix im Studio und tippe auf <b>Speichern</b>.</div>'}</section>`;
}

function padHtml(p) {
  const g = G[p.g];
  if (!isFree(p)) return `<button class="pad locked" data-act="unlock" data-kind="pad" data-id="${p.id}" aria-label="${p.label}, gesperrt, ${p.cost} Sterne">${ICON.lock(18)}<span>${p.label}</span><span class="cost">${ICON.star(12)}${p.cost}</span></button>`;
  const on = S.edit.active.includes(p.id);
  return `<button class="pad${on ? ' on' : ''}" data-act="pad" data-id="${p.id}" aria-pressed="${on}" style="--c:${g.color};--g:${g.glow}"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="dot" aria-hidden="true"></span>${p.label}</button>`;
}
function viewStudio() {
  const m = S.edit, w = WORLD[m.world] || WORLDS[0];
  return `
  <header class="top"><div class="grow"><div class="h1 ellip">${esc(m.name || 'Neuer Mix')}</div>
    <div class="mut sm">Klangwelt ${w.name}${S.dirty && m.active.length ? ' · nicht gespeichert' : ''}</div></div>
    <button class="tempo" data-act="tempo" aria-label="Tempo ${tempoName(m.tempo)}, tippen zum Ändern"><div class="v">${m.tempo}</div><div class="n">${tempoName(m.tempo)}</div></button>
    ${starPill()}</header>
  <div class="segs" aria-hidden="true">${'<i></i>'.repeat(8)}</div>
  ${GROUPS.map(g => `<section><div class="grp-h"><span class="dotc" style="background:${g.color}"></span><span class="b">${g.name}</span></div>
    <div class="pads">${PADS.filter(p => p.g === g.id).map(padHtml).join('')}</div></section>`).join('')}`;
}
function dockStudio() {
  const on = SEQ.playing && SEQ.source === 'edit', n = S.edit.active.length;
  return `<div class="dock-row">
    <button class="bigplay${on ? ' on' : ''}" data-act="play" aria-label="${on ? 'Pause' : 'Abspielen'}">${on ? ICON.pause(28) : ICON.play(28)}</button>
    <div class="grow"><div class="b">${n === 0 ? 'Noch Stille' : n === 1 ? '1 Klang spielt mit' : n + ' Klänge spielen mit'}</div><div class="mut sm">Knopf antippen: an oder aus</div></div>
    <button class="btn mint small" data-act="save" style="min-height:52px">${ICON.save(20)} Speichern</button></div>`;
}
function viewRaster() {
  const m = S.edit;
  const tracks = PADS.filter(p => m.active.includes(p.id));
  const head = `<header class="top"><div class="grow"><div class="h1">Beat-Raster</div><div class="mut sm">Wann spielt welcher Klang?</div></div>${starPill()}</header>`;
  if (!tracks.length) return head + `<div class="empty">Hier siehst du deine Klänge, sobald du im Studio welche angeschaltet hast.</div>
    <button class="btn yel" data-act="tab" data-tab="studio">${ICON.grid(20)} Zum Studio</button>`;
  return head + `
  <div class="bnums" aria-hidden="true">${[1,2,3,4,5,6,7,8].map(n => `<div>${n}</div>`).join('')}</div>
  ${tracks.map(p => {
    const g = G[p.g], pat = patOf(m, p.id);
    return `<section><div class="track-h"><span class="sq" style="background:${g.color}"></span><span class="b">${p.label}</span><span class="mut xs">${g.short || g.name}</span></div>
      <div class="cells" style="--c:${g.color};--g:${g.glow}">${pat.map((d, i) => `<button class="cell${d ? ' on' : ''}${i % 2 ? ' alt' : ''}" data-act="cell" data-id="${p.id}" data-i="${i}" aria-pressed="${!!d}" aria-label="${p.label}, Schlag ${i + 1}"></button>`).join('')}</div></section>`;
  }).join('')}
  <div class="row gap8">
    <button class="btn ghost small grow" data-act="clear">${ICON.eraser(18)} Leeren</button>
    <button class="btn ghost small grow" data-act="reset">${ICON.note(18)} Original</button>
    <button class="btn outline small grow" data-act="random" style="--c:var(--mint)">${ICON.dice(18)} Zufall</button>
  </div>`;
}
function dockPlayOnly() {
  const on = SEQ.playing && SEQ.source === 'edit';
  return `<div class="dock-row">
    <button class="bigplay${on ? ' on' : ''}" data-act="play" aria-label="${on ? 'Pause' : 'Abspielen'}">${on ? ICON.pause(28) : ICON.play(28)}</button>
    <div class="grow"><div class="b">${on ? 'Läuft…' : 'Pause'}</div><div class="mut sm">${esc(S.edit.name || 'Neuer Mix')}</div></div>
    <button class="btn mint small" data-act="save" style="min-height:52px">${ICON.save(20)} Speichern</button></div>`;
}
function faderHtml(g) {
  const m = S.edit, v = m.vol[g.id] == null ? 70 : m.vol[g.id], mu = !!m.mute[g.id];
  return `<div class="fcol${mu ? ' muted' : ''}" style="--c:${g.color}">
    <div class="fval" data-fv="${g.id}">${mu ? 0 : v}</div>
    <div class="fader" data-fader="${g.id}" role="slider" tabindex="0" aria-label="Lautstärke ${g.short || g.name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}">
      <div class="rail"><div class="fill" style="height:${v}%"></div><div class="thumb" style="bottom:calc(${v}% - 14px)"></div></div></div>
    <button class="mute${mu ? ' off' : ''}" data-act="mute" data-g="${g.id}" aria-pressed="${mu}" aria-label="${g.short || g.name} ${mu ? 'wieder einschalten' : 'stumm schalten'}">${mu ? ICON.mute(20) : ICON.vol(20)}</button>
    <div class="fname">${g.short || g.name}</div></div>`;
}
function viewMixer() {
  const m = S.edit;
  const knobs = FX.map(f => {
    if (!isFree(f)) return `<button class="knob locked" data-act="fx" data-id="${f.id}" aria-label="${f.name}, gesperrt, ${f.cost} Sterne">
      <span style="height:64px;display:flex;align-items:center">${ICON.lock(30)}</span><span class="b sm">${f.name}</span><span class="cost">${ICON.star(12)} ${f.cost}</span></button>`;
    const lv = m.fx[f.id] || 0;
    return `<button class="knob" data-act="fx" data-id="${f.id}" aria-label="${f.name}: ${lv ? 'Stufe ' + lv : 'aus'}, tippen zum Ändern">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="25" fill="none" stroke="#2E2A5A" stroke-width="7"/>
      <circle cx="32" cy="32" r="25" fill="none" stroke="${f.color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(lv / 4 * 157).toFixed(1)} 157" transform="rotate(-90 32 32)"/>
      <circle cx="32" cy="32" r="13" fill="${lv ? '#F5F3FF' : '#5A5590'}"/></svg>
      <span class="b sm">${f.name}</span><span class="kl">${lv ? 'Stufe ' + lv : 'Aus'}</span></button>`;
  }).join('');
  return `
  <header class="top"><div class="grow"><div class="h1">Mixer</div><div class="mut sm">Mach Klänge lauter oder leiser</div></div>${starPill()}</header>
  <div class="card faders">${GROUPS.map(faderHtml).join('')}</div>
  <section class="col gap10"><div class="h2">Zauber-Effekte</div><div class="mut sm" style="margin-top:-4px">Tippe mehrmals für mehr Zauber.</div>
    <div class="fxgrid">${knobs}</div></section>`;
}
function shopItem(kind, it) {
  const own = isFree(it), color = itemColor(kind, it);
  const ic = kind === 'world' ? ICON.world[it.id](24) : kind === 'fx' ? ICON.fx(24) : ICON.note(24);
  return `<div class="item${own ? ' own' : ''}"><span class="item-ic" style="background:${color}">${ic}</span>
    <div class="grow"><div class="b">${esc(it.label || it.name)}</div><div class="mut sm">${kindName(kind, it)}</div></div>
    ${kind === 'pad' ? `<button class="ic-btn" data-act="preview" data-id="${it.id}" aria-label="${it.label} probehören">${ICON.ear(20)}</button>` : ''}
    ${own ? `<span class="owned">${ICON.check(18)} Deins</span>`
      : `<button class="btn small ${S.stars >= it.cost ? 'yel' : 'ghost'}" data-act="unlock" data-kind="${kind}" data-id="${it.id}" style="${S.stars >= it.cost ? '' : 'background:var(--bg)'}">${ICON.star(16)} ${it.cost}</button>`}</div>`;
}
function viewShop() {
  const pads = PADS.filter(p => p.cost), fx = FX.filter(f => f.cost), w = WORLDS.filter(x => x.cost);
  const doneN = ACH.filter(a => S.ach[a.id]).length;
  return `
  <header class="top"><div class="grow"><div class="h1">Schatzkiste</div><div class="mut sm">Schalte neue Klänge frei</div></div>${starPill()}</header>
  <div class="card col gap10"><div class="b">So sammelst du Sterne</div>
    <div class="earn"><div><b>+5</b> Tagesgeschenk auf der Startseite</div><div><b>+3</b> ein neues Lied speichern (mind. 3 Klänge)</div>
    <div><b>+1</b> fleißig mischen, während die Musik läuft</div><div><b>+2 bis +10</b> für jeden Erfolg</div></div></div>
  <section class="col gap10"><div class="h2">Instrumente</div>${pads.map(p => shopItem('pad', p)).join('')}</section>
  <section class="col gap10"><div class="h2">Zauber-Effekte</div>${fx.map(f => shopItem('fx', f)).join('')}</section>
  <section class="col gap10"><div class="h2">Klangwelten</div>${w.map(x => shopItem('world', x)).join('')}</section>
  <section class="col gap10"><div class="row" style="justify-content:space-between;align-items:baseline"><div class="h2">Erfolge</div><div class="mut sm">${doneN} von ${ACH.length}</div></div>
    ${ACH.map(a => { const d = !!S.ach[a.id]; return `<div class="ach${d ? ' done' : ''}"><span class="ach-ic">${d ? ICON.check(20) : ICON.trophy(20)}</span>
      <div class="grow"><div class="b">${a.t}</div><div class="mut sm">${a.d}</div></div><span class="cost">${ICON.star(14)} ${a.r}</span></div>`; }).join('')}</section>`;
}

function renderNav() {
  const tabs = [['start','Start',ICON.home],['studio','Studio',ICON.grid],['raster','Raster',ICON.raster],['mixer','Mixer',ICON.mixer],['shop','Schätze',ICON.chest]];
  const badge = canBuySomething();
  $('#nav').innerHTML = tabs.map(([id, n, ic]) =>
    `<button class="nav-btn${UI.tab === id ? ' on' : ''}" data-act="tab" data-tab="${id}" ${UI.tab === id ? 'aria-current="page"' : ''}>${ic(24)}${n}${id === 'shop' && badge ? '<span class="badge" aria-label="Du kannst etwas freischalten"></span>' : ''}</button>`).join('');
}
function render(resetScroll) {
  const scr = $('#screen'), top = scr.scrollTop;
  const v = {start:viewStart, studio:viewStudio, raster:viewRaster, mixer:viewMixer, shop:viewShop}[UI.tab] || viewStart;
  scr.innerHTML = v();
  $('#dock').innerHTML = UI.tab === 'studio' ? dockStudio() : (UI.tab === 'raster' || UI.tab === 'mixer') && S.edit.active.length ? dockPlayOnly() : '';
  renderNav();
  scr.scrollTop = resetScroll ? 0 : top;
  if (SEQ.playing && SEQ.vis >= 0) showStep(SEQ.vis);
}

/* ---------- Dialoge, Meldungen, Konfetti ---------- */
function modal(html) {
  const el = $('#modal');
  el.innerHTML = `<div class="scrim" data-act="closemodal"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  el.classList.add('open');
  const f = el.querySelector('input') || el.querySelector('.sheet button');
  if (f) setTimeout(() => { try { f.focus({preventScroll:true}); if (f.select) f.select(); } catch (e) {} }, 60);
}
function closeModal() { const el = $('#modal'); el.classList.remove('open'); el.innerHTML = ''; }
function toast(html, star) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (star ? `<span class="st">${ICON.star(18)}</span>` : '') + html;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 2800);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}
function confetti() {
  const box = $('#confetti'), cols = ['#FF6B57','#4D9FFF','#FFC93C','#3EE0A8','#FF7AC6','#B39DFF'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('i');
    c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = 1.4 + Math.random() * 0.8 + 's';
    box.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

/* ---------- Ereignisse ---------- */
const ACT = {
  tab: d => { UI.tab = d.tab; closeModal(); render(true); },
  pad: d => togglePad(d.id),
  unlock: d => unlockModal(d.kind, d.id),
  dounlock: d => doUnlock(d.kind, d.id),
  preview: d => preview(d.id),
  play: () => toggleEditPlay(),
  tempo: () => cycleTempo(),
  save: () => saveModal(),
  dosave: d => doSave(!!d.new),
  cell: d => toggleCell(d.id, +d.i),
  clear: () => clearPatterns(),
  reset: () => resetPatterns(),
  random: () => randomPatterns(),
  mute: d => toggleMute(d.g),
  fx: d => tapFx(d.id),
  world: d => pickWorld(d.id),
  newmix: () => startNewMix(),
  gift: () => takeGift(),
  listen: d => listen(d.id),
  songmenu: d => songMenu(d.id),
  editsong: d => editSong(d.id),
  rename: d => renameSong(d.id),
  delsong: d => confirmDelete(d.id),
  dodel: d => deleteSong(d.id),
  closemodal: () => { pendingConfirm = null; closeModal(); },
  confirm: () => { const f = pendingConfirm; pendingConfirm = null; closeModal(); if (f) f(); },
  install: () => doInstall()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (f) f(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'songname') { e.preventDefault(); doSave(false); }
  if (e.key === 'Enter' && e.target.id === 'rename') { e.preventDefault(); const b = document.querySelector('[data-act="rename"]'); if (b) renameSong(b.dataset.id); }
  if (e.key === 'Escape' && $('#modal').classList.contains('open')) { pendingConfirm = null; closeModal(); }
  const fd = e.target.closest && e.target.closest('.fader');
  if (fd && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const g = fd.dataset.fader, v = S.edit.vol[g] == null ? 70 : S.edit.vol[g];
    setVol(g, clamp(v + (e.key === 'ArrowUp' || e.key === 'ArrowRight' ? 5 : -5), 0, 100), fd);
  }
});
// Schieberegler (Mixer)
function setVol(gid, v, fd) {
  S.edit.vol[gid] = v; markEdit();
  if (SEQ.mix === S.edit) applyMix(S.edit);
  fd.setAttribute('aria-valuenow', v);
  fd.querySelector('.fill').style.height = v + '%';
  fd.querySelector('.thumb').style.bottom = 'calc(' + v + '% - 14px)';
  const lab = document.querySelector('[data-fv="' + gid + '"]');
  if (lab && !S.edit.mute[gid]) lab.textContent = v;
}
document.addEventListener('pointerdown', e => {
  const fd = e.target.closest('.fader'); if (!fd) return;
  e.preventDefault();
  try { fd.setPointerCapture(e.pointerId); } catch (er) {}
  const rail = fd.querySelector('.rail');
  const move = ev => { const r = rail.getBoundingClientRect(); setVol(fd.dataset.fader, clamp(Math.round((1 - (ev.clientY - r.top) / r.height) * 100), 0, 100), fd); };
  const up = () => { fd.removeEventListener('pointermove', move); fd.removeEventListener('pointerup', up); fd.removeEventListener('pointercancel', up); };
  move(e);
  fd.addEventListener('pointermove', move); fd.addEventListener('pointerup', up); fd.addEventListener('pointercancel', up);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (SEQ.playing) { stopSeq(); render(); } try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (UI.tab === 'start') render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('Klangkiste ist jetzt installiert!'); render(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

render(true);
</script>
</body>
</html>
